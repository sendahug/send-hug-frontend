version: 2.1
orbs:
  browser-tools: circleci/browser-tools@2.0.0
  cypress: cypress-io/cypress@4.1.0
  codecov: codecov/codecov@5.4.3
jobs:
  lint:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - restore_cache:
          key: send-hug-v1-
      - run: npm install
      - save_cache:
          key: send-hug-v1-{{ checksum "package-lock.json" }}
          paths:
            - "node_modules"
      - run: npx prettier --check .
      - run: npm run lint
  test:
    docker:
      - image: cimg/node:lts-browsers
    environment:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - checkout
      - run: sudo apt-get update
      - browser-tools/install_browser_tools
      - run: google-chrome --version
      - restore_cache:
          key: send-hug-v1-
      - run: npm install
      - save_cache:
          key: send-hug-v1-{{ checksum "package-lock.json" }}
          paths:
            - "node_modules"
      - run: sudo apt-get update && npx playwright install --with-deps
      - run: npm test
      - codecov/upload
  e2e:
    docker:
      - image: cimg/python:3.11-node
        environment:
          BASE_DATABASE_URL: postgresql://postgres:password@localhost:5432/sendahug
          QUART_APP: send-hug-backend/app.py:app
          FLASK_ENV: development
          FRONTEND: http://localhost:3000
          FIREBASE_CREDENTIALS_FILE: /home/circleci/send-hug-backend/test_creds.json
      - image: cimg/postgres:14.10
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: sendahug
          POSTGRES_PASSWORD: password
    environment:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - checkout
      - run: |
          sudo npm install -g pa11y-ci --unsafe-perm=true --allow-root
          sudo apt-get update
          sudo apt-get install -y postgresql-client python3-pip xvfb
      - run: |
          cd ..
          git clone https://github.com/sendahug/send-hug-backend
      - run: |
          cd ..
          echo "$FIREBASE_TEST_ACCT_KEY" > send-hug-backend/test_creds.json
      - run:
          name: Install Python deps
          command: |
            cd ..
            pip3 install -r send-hug-backend/requirements.txt
            python3 -m pip install --upgrade pip
      # Dockerize installation to wait for the database to load
      # Taken from: https://support.circleci.com/hc/en-us/articles/360006773953-Race-Conditions-Wait-For-Database
      - run:
          name: Wait for db
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run: psql -d $BASE_DATABASE_URL -c "CREATE ROLE circleci WITH SUPERUSER LOGIN;"
      - run:
          name: Restore database
          command: |
            mv e2e/setup.py ../send-hug-backend
            cd ../send-hug-backend
            python3 setup.py
      - run:
          name: Start backend
          command: |
            cd ..
            quart run
          background: true
      - run: sudo apt-get update
      - browser-tools/install_browser_tools
      - run: google-chrome --version
      - cypress/install
      - restore_cache:
          key: send-hug-v1-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: send-hug-v1-{{ checksum "package-lock.json" }}
          paths:
            - "node_modules"
      - run: npm i -g wait-on
      - run:
          name: Start frontend server
          command: npm run dev
          background: true
      - run: wait-on http://localhost:3000
      - run:
          name: Run e2e tests
          command: npm run cypress
      - store_artifacts:
          path: /home/circleci/project/cypress
          destination: cypress-screenshots
  accessibility:
    docker:
      - image: cimg/python:3.11-node
        environment:
          BASE_DATABASE_URL: postgresql://postgres:password@localhost:5432/sendahug
          QUART_APP: send-hug-backend/app.py:app
          FLASK_ENV: development
          FRONTEND: http://localhost:3000
          FIREBASE_CREDENTIALS_FILE: /home/circleci/send-hug-backend/test_creds.json
      - image: cimg/postgres:14.10
        auth:
          username: mydockerhub-user
          password: $DOCKERHUB_PASSWORD # context / project UI env-var reference
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: sendahug
          POSTGRES_PASSWORD: password
    environment:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - checkout
      - run: |
          sudo npm install -g pa11y-ci --unsafe-perm=true --allow-root
          sudo apt-get update
          sudo apt-get install -y postgresql-client python3-pip xvfb
      - run: |
          cd ..
          git clone https://github.com/sendahug/send-hug-backend
      - run: |
          cd ..
          echo "$FIREBASE_TEST_ACCT_KEY" > send-hug-backend/test_creds.json
      - run:
          name: Install Python deps
          command: |
            cd ..
            pip3 install -r send-hug-backend/requirements.txt
            python3 -m pip install --upgrade pip
      # Dockerize installation to wait for the database to load
      # Taken from: https://support.circleci.com/hc/en-us/articles/360006773953-Race-Conditions-Wait-For-Database
      - run:
          name: Wait for db
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run: psql -d $BASE_DATABASE_URL -c "CREATE ROLE circleci WITH SUPERUSER LOGIN;"
      - run:
          name: Restore database
          command: |
            mv e2e/setup.py ../send-hug-backend
            cd ../send-hug-backend
            python3 setup.py
      - run:
          name: Start backend
          command: |
            cd ..
            quart run
          background: true
      - run: sudo apt-get update
      - browser-tools/install_browser_tools
      - run: google-chrome --version
      - restore_cache:
          key: send-hug-v1-
      - run: mkdir pa11y
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: send-hug-v1-{{ checksum "package-lock.json" }}
          paths:
            - "node_modules"
      - run: npm i -g wait-on
      - run:
          name: Start frontend server
          command: npm run dev
          background: true
      - run: wait-on http://localhost:3000
      - run:
          name: Run accessibility tests
          command: npm run pa11y
      - store_artifacts:
          path: pa11y
          destination: pa11y-screenshots

workflows:
  run-testing:
    jobs:
      - lint
      - test
      - e2e
      - accessibility
