name: Update Changelog
permissions:
  actions: read
  contents: write
  pull-requests: write

on:
  push:
    branches: [dev]

jobs:
  update_changelog:
    uses: sendahug/send-a-workflow/.github/workflows/updatechangelog.yml@main
    with:
      base_repo_url: "https://github.com/sendahug/send-hug-frontend"
      repository: "send-hug-frontend"
    secrets: inherit
