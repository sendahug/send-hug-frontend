<div
  role="progressbar"
  aria-describedby="loadingMessage"
  aria-busy="true"
  class="loading"
  [id]="'loading' + idSuffix()"
  [title]="loadingMessage()"
>
  <div class="logo"></div>
  <div class="spinner" media="(prefers-reduced-motion: no-preference)"></div>
  <div class="loadingMessage" [id]="'loadingMessage' + idSuffix()">{{ loadingMessage() }}</div>
</div>
