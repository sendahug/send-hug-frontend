<div
  [id]="'loading' + idSuffix()"
  role="progressbar"
  aria-describedby="loadingMessage"
  aria-busy="true"
  [title]="loadingMessage()"
>
  <div class="logo"></div>
  <div class="spinner" media="(prefers-reduced-motion: no-preference)"></div>
  <div [id]="'loadingMessage' + idSuffix()">{{ loadingMessage() }}</div>
</div>
