<app-pop-up *teleport="'modalContainer'" (editMode)="editMode.emit(false)">
  <div id="deleteItem" class="deleteItem">
    <div class="popupText">Are you sure you want to delete this item?</div>
    <div class="popupText warning">This action is irreversible!</div>

    <!-- If the user is deleting something -->
    <div *ngIf="isAdmin() === false" class="buttons">
      <button class="appButton popupDeleteBtn" (click)="deleteItem()">Yes, Delete</button>
      <button class="appButton popupDeleteBtn" id="cancel" (click)="editMode.emit(false)">
        Never Mind
      </button>
    </div>

    <!-- If the user is deleting something from admin menu -->
    <div *ngIf="isAdmin() === true" class="buttons">
      <button class="appButton deleteButton popupDeleteBtn" (click)="deleteItem()">
        Delete and Close Report
      </button>
      <button class="appButton popupDeleteBtn" id="adminCancel" (click)="editMode.emit(false)">
        Never Mind
      </button>
    </div>
  </div>
</app-pop-up>
