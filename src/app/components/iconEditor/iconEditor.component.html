<form [formGroup]="iconEditForm">
  <label for="characterSelect">Select Icon:</label>
  <div id="characterSelect" role="radiogroup">
    <div class="formElement">
      <input
        type="radio"
        class="radioButton"
        id="cRadioOption1"
        value="bear"
        aria-describedby=""
        formControlName="selectedIcon"
      />
      <label class="radioButtonLabel" for="cRadioOption1"
        ><img alt="" class="editIconOption" [src]="BearIconSrc"
      /></label>
    </div>
    <div class="formElement">
      <input
        type="radio"
        class="radioButton"
        id="cRadioOption2"
        value="kitty"
        aria-describedby=""
        formControlName="selectedIcon"
      />
      <label class="radioButtonLabel" for="cRadioOption2"
        ><img alt="" class="editIconOption" [src]="KittyIconSrc"
      /></label>
    </div>
    <div class="formElement">
      <input
        type="radio"
        class="radioButton"
        id="cRadioOption3"
        value="dog"
        aria-describedby=""
        formControlName="selectedIcon"
      />
      <label class="radioButtonLabel" for="cRadioOption3"
        ><img alt="" class="editIconOption" [src]="DogIconSrc"
      /></label>
    </div>
  </div>

  <div class="hint">
    <strong>Note: </strong>Changing your icon resets any unsaved colour changes!
  </div>

  <!-- This is done that way to ensure we inline all three icons -->
  <app-user-icon
    [selectedIcon]="iconEditForm.controls.selectedIcon.value || 'kitty'"
    [characterColour]="iconEditForm.controls.characterColour.value || undefined"
    [lbgColour]="iconEditForm.controls.lbgColour.value || undefined"
    [rbgColour]="iconEditForm.controls.rbgColour.value || undefined"
    [itemColour]="iconEditForm.controls.itemColour.value || undefined"
    [svgClass]="'selectedCharacter'"
  />

  <div class="formElement">
    <label for="characterC">Select Character Colour: </label>
    <input
      value="{{ iconEditForm.controls.characterColour.value }}"
      type="color"
      id="characterC"
      formControlName="characterColour"
    />
  </div>

  <div class="formElement">
    <label for="lbgColour">Select Left Background Colour: </label>
    <input
      value="{{ iconEditForm.controls.lbgColour.value }}"
      type="color"
      id="lbgColour"
      formControlName="lbgColour"
    />
  </div>

  <div class="formElement">
    <label for="rbgColour">Select Right Background Colour: </label>
    <input
      value="{{ iconEditForm.controls.rbgColour.value }}"
      type="color"
      id="rbgColour"
      formControlName="rbgColour"
    />
  </div>

  <div class="formElement">
    <label for="itemColour">Select Hand-Held Item Colour: </label>
    <input
      value="{{ iconEditForm.controls.itemColour.value }}"
      type="color"
      id="itemColour"
      formControlName="itemColour"
    />
  </div>

  <div class="buttonsContainer">
    <button type="submit" class="appButton iconButton" (click)="dismiss()">Never Mind</button>
    <button type="submit" class="appButton iconButton" (click)="updateIcon($event)">
      Update Icon
    </button>
  </div>
</form>
