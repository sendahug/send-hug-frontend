<div class="messageProfilePic">
  <app-user-icon
    [selectedIcon]="userIconToShow().selectedIcon ?? 'kitty'"
    [characterColour]="userIconToShow().iconColours?.character"
    [lbgColour]="userIconToShow().iconColours?.lbg"
    [rbgColour]="userIconToShow().iconColours?.rbg"
    [itemColour]="userIconToShow().iconColours?.item"
    [svgClass]="'userIcon'"
  />
</div>
<div class="messageContainer">
  <div id="{{ 'text' + _message().id }}" class="messageText" aria-describedby="mText">
    {{ _message().messageText }}
  </div>
  <div *ngIf="displayFrom()" class="messageField">
    <span class="pageCategory">From:</span
    ><span class="pageData" aria-describedby="mUserFrom">
      {{ _message().from.displayName }}
    </span>
  </div>
  <div *ngIf="displayFor()" class="messageField">
    <span class="pageCategory">For:</span
    ><span class="pageData" aria-describedby="mUserFor">
      {{ _message().for.displayName }}
    </span>
  </div>
  <div class="messageField">
    <span class="pageCategory">Date:</span>
    <span class="pageData" aria-describedby="mDate">
      {{ _message().date }}
    </span>
  </div>
  <div class="buttons">
    <a
      *ngIf="displayFrom()"
      class="appButton messageButton"
      [routerLink]="['/new', 'Message']"
      [queryParams]="{ user: _message().from.displayName, userID: _message().fromId }"
      [attr.aria-describedby]="'mReply ' + 'text' + _message().id"
      >Reply</a
    >
    <button
      class="appButton deleteButton"
      [attr.aria-describedby]="'mDelete ' + 'mText' + _message().id"
      (click)="deleteMessage()"
    >
      Delete Message
    </button>
  </div>
</div>

<item-delete-form
  *ngIf="deleteMode()"
  [deleteEndpoint]="deleteEndpoint()"
  [itemType]="itemType"
  [itemId]="_message().id"
  (editMode)="changeMode($event)"
  (deleted)="messageDeleted.emit(_message().id)"
></item-delete-form>
