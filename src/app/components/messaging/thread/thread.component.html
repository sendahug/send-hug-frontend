<div class="messageProfilePic">
  <app-user-icon
    [selectedIcon]="_thread().user.selectedIcon"
    [characterColour]="_thread().user.iconColours.character"
    [lbgColour]="_thread().user.iconColours.lbg"
    [rbgColour]="_thread().user.iconColours.rbg"
    [itemColour]="_thread().user.iconColours.item"
    [svgClass]="'userIcon'"
  />
</div>
<div class="messageContainer">
  <div class="messageField">
    <span class="pageCategory">User:</span>
    <span id="{{ 'user' + _thread().id }}" class="pageData" aria-describedby="tUser">{{
      _thread().user.displayName
    }}</span>
  </div>
  <div class="messageField">
    <span class="pageCategory">Messages:</span>
    <span class="pageData" [attr.aria-describedby]="'tNumMess ' + 'user' + _thread().id">{{
      _thread().numMessages
    }}</span>
  </div>
  <div class="messageField">
    <span class="pageCategory">Last Active:</span>
    <span class="pageData" [attr.aria-describedby]="'tLatestMess ' + 'user' + _thread().id">{{
      _thread().latestMessage
    }}</span>
  </div>
  <div class="threadBtns">
    <button
      class="appButton viewButton"
      [attr.aria-describedby]="'tView ' + 'user' + _thread().id"
      (click)="threadSelected.emit(_thread().id)"
    >
      View Thread Messages
    </button>
    <button
      class="appButton deleteButton"
      [attr.aria-describedby]="'tDelete ' + 'user' + _thread().id"
      (click)="deleteThread()"
    >
      Delete Thread
    </button>
  </div>
</div>

<item-delete-form
  *ngIf="deleteMode()"
  [deleteEndpoint]="deleteEndpoint"
  [itemType]="itemType"
  [itemId]="_thread().id"
  (editMode)="changeMode($event)"
  (deleted)="deleteMessagesFromIdb()"
></item-delete-form>
