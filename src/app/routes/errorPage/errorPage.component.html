<div id="errorPage">
  <h3>{{ error().title }}</h3>
  <div class="pageData">{{ error().message }}</div>
  <div class="pageData">Go back to the previous page?</div>
  <button
    id="backBtn"
    class="textlessButton"
    aria-label="Go back to previous page"
    (click)="goBack()"
  >
    <!-- prettier-ignore -->
    <fa-icon class="fa-arrow-alt-circle-left" [icon]="faArrowAltCircleLeft"></fa-icon>
  </button>

  <div id="errorCode">Error code: {{ error().code }}</div>
</div>
