<!-- New items -->
<div id="newItems" class="listContainer">
  <h1 class="listTitle" id="newTitle">New Items</h1>

  <app-loader
    *ngIf="isLoading()"
    [loadingMessage]="'Fetching posts...'"
    [idSuffix]="'new'"
  ></app-loader>

  <!-- If there are items in the list -->
  <ul
    class="itemList"
    *ngIf="newPosts().length > 0 && !isLoading()"
    aria-describedby="newTitle"
    id="newItemsList"
  >
    <li *ngFor="let item of newPosts()" class="newItem" aria-describedby="newTitle">
      <app-single-post
        [post]="item"
        [type]="'n'"
        (deletedId)="removeDeletedPost($event)"
      ></app-single-post>
    </li>
  </ul>

  <!-- If there are no items in the list -->
  <div class="errorMessage" *ngIf="newPosts().length == 0 && !isLoading()">
    There are no recent items.
  </div>

  <a
    [routerLink]="['/list', 'New']"
    [queryParams]="{ page: 1 }"
    class="textlessButton fullButton"
    role="navigation"
    aria-label="View full list of new items"
    >View Full 'New' List</a
  >
</div>
